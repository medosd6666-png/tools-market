
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تغيير حجم الصور | سوق الأدوات</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 24px;
    font-family: Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #eaf4ff, #f4f0ff);
    color: #1f2937;
    line-height: 1.8;
}

.container {
    max-width: 800px;
    margin: 20px auto;
    padding: 30px;
    background: #fff;
    border: 1px solid #dbe7f3;
    border-radius: 22px;
    box-shadow: 0 12px 35px rgba(30,64,100,0.12);
}

header { text-align: center; margin-bottom: 28px; }

.back {
    display: inline-block;
    margin-bottom: 14px;
    color: #1454a3;
    text-decoration: none;
    font-weight: bold;
}

h1 { margin: 0 0 8px; color: #1454a3; font-size: 30px; }
h2 { color: #1454a3; font-size: 22px; }
.intro { margin: 0; color: #64748b; }

.panel {
    padding: 22px;
    margin-bottom: 22px;
    border: 1px solid #dbe7f3;
    border-radius: 16px;
    background: #fff;
}

.field-label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

input[type="file"] {
    display: block;
    width: 100%;
    padding: 13px;
    border: 1px dashed #94a3b8;
    border-radius: 12px;
    background: #f8fafc;
    font: inherit;
}

.hint {
    color: #64748b;
    font-size: 14px;
    overflow-wrap: anywhere;
}

.dimensions {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    margin: 22px 0;
}

.dimensions label { font-weight: bold; }

.dimensions input {
    display: block;
    width: 100%;
    margin-top: 7px;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    font: inherit;
}

input:focus {
    outline: 2px solid #93c5fd;
    border-color: #2563eb;
}

.check-label {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 16px 0 22px;
}

.check-label input { width: 18px; height: 18px; }

button, .download-link {
    display: inline-block;
    padding: 12px 24px;
    border: 0;
    border-radius: 11px;
    background: #1769d2;
    color: white;
    font: inherit;
    font-weight: bold;
    text-decoration: none;
    text-align: center;
    cursor: pointer;
}

button:hover, .download-link:hover { background: #0f4fa8; }
button:disabled { background: #94a3b8; cursor: not-allowed; }

#message {
    margin-top: 15px;
    color: #475569;
    overflow-wrap: anywhere;
}

#resultPanel[hidden], #editor[hidden] { display: none; }

.preview {
    display: block;
    max-width: 100%;
    max-height: 420px;
    margin: 18px auto;
    border-radius: 12px;
    object-fit: contain;
    background: #f1f5f9;
}

.result-info { color: #475569; overflow-wrap: anywhere; }

footer {
    text-align: center;
    color: #64748b;
    font-size: 13px;
}

@media (max-width: 520px) {
    body { padding: 12px; }

    .container {
        padding: 18px;
        margin: 8px auto;
    }

    .panel { padding: 16px; }
    h1 { font-size: 25px; }
    .dimensions { gap: 10px; }

    button, .download-link { width: 100%; }
}
</style>
</head>

<body>
<main class="container">

<header>
<a class="back" href="index.html"
data-ar="العودة إلى سوق الأدوات ←"
data-en="← Back to Tools Market">العودة إلى سوق الأدوات ←</a>

<h1 data-ar="تغيير حجم الصور"
data-en="Image Resizer">تغيير حجم الصور</h1>

<p class="intro"
data-ar="غيّر أبعاد صورك بسهولة، ثم نزّل الصورة بالحجم الجديد مجانًا."
data-en="Easily resize your images and download the resized version for free.">
غيّر أبعاد صورك بسهولة، ثم نزّل الصورة بالحجم الجديد مجانًا.
</p>
</header>

<section class="panel">

<label class="field-label" for="imageInput"
data-ar="اختار صورة من جهازك"
data-en="Choose an image from your device">اختار صورة من جهازك</label>

<input id="imageInput" type="file"
accept="image/jpeg,image/png,image/webp">

<p id="fileInfo" class="hint"
data-ar="الصيغ المدعومة: JPG وPNG وWebP."
data-en="Supported formats: JPG, PNG, and WebP.">
الصيغ المدعومة: JPG وPNG وWebP.
</p>

<div id="editor" hidden>

<div class="dimensions">
<label for="widthInput">
<span data-ar="العرض بالبكسل"
data-en="Width in pixels">العرض بالبكسل</span>
<input id="widthInput" type="number" min="1" max="12000" step="1">
</label>

<label for="heightInput">
<span data-ar="الارتفاع بالبكسل"
data-en="Height in pixels">الارتفاع بالبكسل</span>
<input id="heightInput" type="number" min="1" max="12000" step="1">
</label>
</div>

<label class="check-label">
<input id="keepRatio" type="checkbox" checked>
<span data-ar="الحفاظ على تناسب أبعاد الصورة"
data-en="Maintain image aspect ratio">الحفاظ على تناسب أبعاد الصورة</span>
</label>

<button id="resizeButton" type="button"
data-ar="تغيير حجم الصورة"
data-en="Resize Image">تغيير حجم الصورة</button>

<p id="message" role="status" aria-live="polite"
data-ar="حدد المقاس المطلوب ثم اضغط زر تغيير الحجم."
data-en="Set the desired dimensions, then click Resize Image.">
حدد المقاس المطلوب ثم اضغط زر تغيير الحجم.
</p>

</div>
</section>

<section id="resultPanel" class="panel" hidden>
<h2 data-ar="الصورة بعد تغيير الحجم"
data-en="Resized Image">الصورة بعد تغيير الحجم</h2>

<img id="previewImage" class="preview"
alt="معاينة الصورة بعد تغيير الحجم">

<p id="resultInfo" class="result-info"></p>

<a id="downloadLink" class="download-link" href="#" download
data-ar="تنزيل الصورة الجديدة"
data-en="Download Resized Image">
تنزيل الصورة الجديدة
</a>
</section>

<footer
data-ar="سوق الأدوات | أدوات مجانية وسهلة للجميع"
data-en="Tools Market | Free and easy tools for everyone">
سوق الأدوات | أدوات مجانية وسهلة للجميع
</footer>

</main>

<script src="language.js"></script>

<script>
// قراءة اللغة المختارة من الرابط أو الإعداد المحفوظ
function getLanguage() {
    const params = new URLSearchParams(window.location.search);
    const pageLanguage = params.get('lang');

    if (pageLanguage === 'en' || pageLanguage === 'ar') {
        return pageLanguage;
    }

    try {
        return localStorage.getItem('toolsMarketLanguage') === 'en'
            ? 'en'
            : 'ar';
    } catch (error) {
        return 'ar';
    }
}

function t(ar, en) {
    return getLanguage() === 'en' ? en : ar;
}

// تشغيل الترجمة بعد تحميل عناصر الصفحة
if (typeof applyPageLanguage === 'function') {
    applyPageLanguage();
} else {
    const language = getLanguage();
    const isArabic = language === 'ar';

    document.documentElement.lang = language;
    document.documentElement.dir = isArabic ? 'rtl' : 'ltr';

    document.querySelectorAll('[data-ar][data-en]').forEach(function(element) {
        element.textContent = isArabic
            ? element.getAttribute('data-ar')
            : element.getAttribute('data-en');
    });

    document.querySelector('title').textContent = isArabic
        ? 'تغيير حجم الصور | سوق الأدوات'
        : 'Image Resizer | Tools Market';
}

const imageInput = document.getElementById('imageInput');
const fileInfo = document.getElementById('fileInfo');
const editor = document.getElementById('editor');
const widthInput = document.getElementById('widthInput');
const heightInput = document.getElementById('heightInput');
const keepRatio = document.getElementById('keepRatio');
const resizeButton = document.getElementById('resizeButton');
const message = document.getElementById('message');
const resultPanel = document.getElementById('resultPanel');
const previewImage = document.getElementById('previewImage');
const resultInfo = document.getElementById('resultInfo');
const downloadLink = document.getElementById('downloadLink');

let sourceImage = null;
let originalFile = null;
let aspectRatio = 1;
let sourceUrl = '';
let outputUrl = '';

function formatBytes(bytes) {
    if (bytes < 1024) {
        return bytes + t(' بايت', ' bytes');
    }

    if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(2) + t(' كيلوبايت', ' KB');
    }

    return (bytes / (1024 * 1024)).toFixed(2) + t(' ميجابايت', ' MB');
}

function clearOutput() {
    if (outputUrl) URL.revokeObjectURL(outputUrl);

    outputUrl = '';
    previewImage.removeAttribute('src');
    downloadLink.removeAttribute('href');
    resultPanel.hidden = true;
}

imageInput.addEventListener('change', function() {
    clearOutput();
    editor.hidden = true;
    resizeButton.disabled = true;
    sourceImage = null;
    originalFile = null;

    const file = imageInput.files[0];
    if (!file) return;

    const allowedTypes = ['image/jpeg', 'image/png', 'image/webp'];

    if (!allowedTypes.includes(file.type)) {
        fileInfo.textContent = t(
            'من فضلك اختار صورة بصيغة JPG أو PNG أو WebP.',
            'Please choose an image in JPG, PNG, or WebP format.'
        );
        imageInput.value = '';
        return;
    }

    if (sourceUrl) URL.revokeObjectURL(sourceUrl);

    sourceUrl = URL.createObjectURL(file);
    const img = new Image();

    img.onload = function() {
        sourceImage = img;
        originalFile = file;
        aspectRatio = img.naturalWidth / img.naturalHeight;

        widthInput.value = img.naturalWidth;
        heightInput.value = img.naturalHeight;

        fileInfo.textContent =
            t('الصورة الأصلية: ', 'Original image: ') +
            img.naturalWidth + ' × ' + img.naturalHeight +
            t(' بكسل، والحجم ', ' pixels, size ') +
            formatBytes(file.size) + '.';

        editor.hidden = false;
        resizeButton.disabled = false;

        message.textContent = t(
            'حدد العرض والارتفاع المطلوبين.',
            'Set the desired width and height.'
        );
    };

    img.onerror = function() {
        fileInfo.textContent = t(
            'تعذّر فتح الصورة. جرّب اختيار صورة أخرى.',
            'Could not open the image. Try choosing another image.'
        );

        if (sourceUrl) URL.revokeObjectURL(sourceUrl);

        sourceUrl = '';
        imageInput.value = '';
    };

    img.src = sourceUrl;
});

widthInput.addEventListener('input', function() {
    if (keepRatio.checked && aspectRatio > 0 && widthInput.value !== '') {
        heightInput.value = Math.max(
            1, Math.round(Number(widthInput.value) / aspectRatio)
        );
    }
});

heightInput.addEventListener('input', function() {
    if (keepRatio.checked && aspectRatio > 0 && heightInput.value !== '') {
        widthInput.value = Math.max(
            1, Math.round(Number(heightInput.value) * aspectRatio)
        );
    }
});

resizeButton.addEventListener('click', function() {
    if (!sourceImage || !originalFile) {
        message.textContent = t(
            'اختار صورة أولًا.',
            'Choose an image first.'
        );
        return;
    }

    const width = Number(widthInput.value);
    const height = Number(heightInput.value);

    if (!Number.isInteger(width) || !Number.isInteger(height) ||
        width < 1 || height < 1 || width > 12000 || height > 12000) {
        message.textContent = t(
            'اكتب عرضًا وارتفاعًا صحيحين بين 1 و12000 بكسل.',
            'Enter valid width and height values between 1 and 12000 pixels.'
        );
        return;
    }

    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;

    const context = canvas.getContext('2d');

    if (!context) {
        message.textContent = t(
            'تعذّر تجهيز الصورة على هذا المتصفح.',
            'Could not process the image in this browser.'
        );
        return;
    }

    context.imageSmoothingEnabled = true;
    context.imageSmoothingQuality = 'high';
    context.drawImage(sourceImage, 0, 0, width, height);

    resizeButton.disabled = true;

    message.textContent = t(
        'جاري تغيير حجم الصورة...',
        'Resizing image...'
    );

    canvas.toBlob(function(blob) {
        resizeButton.disabled = false;

        if (!blob) {
            message.textContent = t(
                'لم نتمكن من إنشاء الصورة. جرّب مقاسًا أصغر.',
                'Could not create the image. Try smaller dimensions.'
            );
            return;
        }

        clearOutput();

        outputUrl = URL.createObjectURL(blob);
        previewImage.src = outputUrl;

        let extension = 'jpg';

        if (blob.type === 'image/png') extension = 'png';
        if (blob.type === 'image/webp') extension = 'webp';

        let baseName = originalFile.name;
        const dotPosition = baseName.lastIndexOf('.');

        if (dotPosition > 0) {
            baseName = baseName.substring(0, dotPosition);
        }

        downloadLink.href = outputUrl;
        downloadLink.download = baseName + '-resized.' + extension;

        resultInfo.textContent =
            t('الأبعاد الجديدة: ', 'New dimensions: ') +
            width + ' × ' + height +
            t(' بكسل. ', ' pixels. ') +
            t('حجم الصورة الجديدة: ', 'New image size: ') +
            formatBytes(blob.size) +
            t('. حجم الصورة الأصلية: ', '. Original image size: ') +
            formatBytes(originalFile.size) + '.';

        resultPanel.hidden = false;

        message.textContent = t(
            'تم تغيير حجم الصورة بنجاح. تقدر تشوف النتيجة وتنزّلها.',
            'Image resized successfully. You can preview and download it.'
        );

        resultPanel.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
        });

    }, originalFile.type, 0.92);
});

window.addEventListener('beforeunload', function() {
    if (sourceUrl) URL.revokeObjectURL(sourceUrl);
    if (outputUrl) URL.revokeObjectURL(outputUrl);
});
</script>

</body>
</html>
