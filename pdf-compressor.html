<body>
<div class="container">

    <h1 data-ar="ضغط ملفات PDF"
        data-en="Compress PDF Files">
        ضغط ملفات PDF
    </h1>

    <p data-ar="اختر ملف PDF وحدد مستوى الضغط لمحاولة تقليل حجمه."
       data-en="Choose a PDF file and select a compression level to try to reduce its size.">

    </p>

    <p class="note"
       data-ar="تنبيه: الأداة تحول صفحات PDF إلى صور؛ قد تفقد النص القابل للتحديد والبحث، وقد تتغير جودة الصفحات. وقد يصبح الملف أكبر بعد المعالجة."
       data-en="Note: This tool converts PDF pages into images. Selectable and searchable text may be lost, page quality may change, and the output file may become larger.">
        تنبيه: الأداة تحول صفحات PDF إلى صور؛ قد تفقد النص القابل للتحديد والبحث، وقد تتغير جودة الصفحات. وقد يصبح الملف أكبر بعد المعالجة.
    </p>

    <input type="file" id="pdfFile" accept=".pdf,application/pdf">

    <label for="quality"
           data-ar="مستوى الضغط"
           data-en="Compression Level">
        مستوى الضغط
    </label>

    <select id="quality">
        <option value="1.4"
                data-ar="جودة عالية - حجم أكبر نسبيًا"
                data-en="High quality - relatively larger file">
            جودة عالية - حجم أكبر نسبيًا
        </option>

        <option value="1.1" selected
                data-ar="جودة متوسطة - توازن بين الحجم والوضوح"
                data-en="Medium quality - balance between size and clarity">
            جودة متوسطة - توازن بين الحجم والوضوح
        </option>

        <option value="0.85"
                data-ar="ضغط قوي - حجم أصغر ووضوح أقل"
                data-en="Strong compression - smaller size, lower clarity">
            ضغط قوي - حجم أصغر ووضوح أقل
        </option>
    </select>

    <button id="compressBtn"
            data-ar="ضغط ملف PDF"
            data-en="Compress PDF">
        ضغط ملف PDF
    </button>

    <div id="status" aria-live="polite"></div>
    <div id="result" class="result" hidden></div>

    <a class="home" id="homeLink" href="index.html"
       data-ar="العودة إلى الصفحة الرئيسية"

        العودة إلى الصفحة الرئيسية
    </a>

    <footer
        data-ar="سوق الأدوات | أدوات مجانية وسهلة للجميع"
        data-en="Tools Market | Free and Easy Tools for Everyone">
        سوق الأدوات | أدوات مجانية وسهلة للجميع
    </footer>

<script src="language.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const fileInput = document.getElementById("pdfFile");
const qualityInput = document.getElementById("quality");
const button = document.getElementById("compressBtn");
const statusBox = document.getElementById("status");
const resultBox = document.getElementById("result");
const homeLink = document.getElementById("homeLink");

function getLanguage() {
    const params = new URLSearchParams(window.location.search);
    const pageLanguage = params.get("lang");

    if (pageLanguage === "en" || pageLanguage === "ar") {
        return pageLanguage;
    }

    try {
        return localStorage.getItem("toolsMarketLanguage") === "en"
            ? "en"
            : "ar";
    } catch (error) {
        return "ar";
    }
}

function t(ar, en) {
    return getLanguage() === "en" ? en : ar;
}

function setStatus(ar, en) {
    statusBox.textContent = t(ar, en);
}

if (typeof applyPageLanguage === "function") {
    applyPageLanguage();
} else {
    const language = getLanguage();

    document.documentElement.lang = language;
    document.documentElement.dir = language === "ar" ? "rtl" : "ltr";

    document.querySelectorAll("[data-ar][data-en]").forEach(function(element) {
        element.textContent = element.getAttribute(
            language === "en" ? "data-en" : "data-ar"
        );
    });
}

homeLink.href = "index.html?lang=" + getLanguage();

if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

let downloadUrl = null;
let isCompressing = false;

function formatSize(bytes) {
    if (bytes < 1024) {
        return t(
            bytes + " بايت",
            bytes + " bytes"
        );
    }

    if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(2) +
            t(" كيلوبايت", " KB");
    }

    return (bytes / (1024 * 1024)).toFixed(2) +
        t(" ميجابايت", " MB");
}

function clearResult() {
    resultBox.replaceChildren();
    resultBox.hidden = true;

    if (downloadUrl) {
        URL.revokeObjectURL(downloadUrl);
        downloadUrl = null;
    }
}

fileInput.addEventListener("change", function() {
    clearResult();
    statusBox.textContent = "";

    if (fileInput.files[0]) {
        setStatus(
            "تم اختيار الملف. اضغط زر ضغط ملف PDF.",
            "File selected. Click Compress PDF."
        );
    }
});

button.addEventListener("click", async function() {
    const file = fileInput.files[0];

    if (isCompressing) {
        return;
    }

    if (!file) {
        setStatus(
            "من فضلك اختر ملف PDF أولًا.",
            "Please select a PDF file first."
        );
        return;
    }

    if (
        !file.name.toLowerCase().endsWith(".pdf") &&
        file.type !== "application/pdf"
    ) {
        setStatus(
            "الملف المختار ليس ملف PDF.",
            "The selected file is not a PDF."
        );
        return;
    }

    if (!window.pdfjsLib || !window.jspdf) {
        setStatus(
            "تعذر تحميل مكتبات PDF. تأكد من اتصال الإنترنت وأعد فتح الصفحة.",
            "Could not load the PDF libraries. Check your internet connection and reopen the page."
        );
        return;
    }

    isCompressing = true;
    button.disabled = true;
    fileInput.disabled = true;
    qualityInput.disabled = true;
    clearResult();

    try {
        setStatus(
            "جاري قراءة ملف PDF...",
            "Reading the PDF file..."
        );

        const buffer = await file.arrayBuffer();

        const pdf = await pdfjsLib.getDocument({
            data: new Uint8Array(buffer)
        }).promise;

        const { jsPDF } = window.jspdf;

        const output = new jsPDF({
            orientation: "p",
            unit: "pt",
            format: "a4",
            compress: true
        });

        const quality = Number(qualityInput.value);
        let completed = 0;

        for (
            let pageNumber = 1;
            pageNumber <= pdf.numPages;
            pageNumber++
        ) {
            setStatus(
                "جاري معالجة الصفحة " + pageNumber +
                " من " + pdf.numPages + "...",
                "Processing page " + pageNumber +
                " of " + pdf.numPages + "..."
            );

            const page = await pdf.getPage(pageNumber);
            const viewport = page.getViewport({ scale: 1.0 });

            const maxDimension = 1200;

            const scale = Math.min(
                1.5,
                maxDimension /
                Math.max(viewport.width, viewport.height)
            );

            const scaledViewport = page.getViewport({
                scale: scale
            });

            const canvas = document.createElement("canvas");
            canvas.width = Math.ceil(scaledViewport.width);
            canvas.height = Math.ceil(scaledViewport.height);

            const context = canvas.getContext("2d");

            if (!context) {
                throw new Error("Could not create canvas context.");
            }

            await page.render({
                canvasContext: context,
                viewport: scaledViewport
            }).promise;

            const imageData = canvas.toDataURL(
                "image/jpeg",
                Math.min(0.95, Math.max(0.45, quality / 1.5))
            );

            if (pageNumber > 1) {
                output.addPage("a4", "p");
            }

            const pageWidth = output.internal.pageSize.getWidth();
            const pageHeight = output.internal.pageSize.getHeight();

            const ratio = Math.min(
                pageWidth / canvas.width,
                pageHeight / canvas.height
            );

            const imageWidth = canvas.width * ratio;
            const imageHeight = canvas.height * ratio;
            const x = (pageWidth - imageWidth) / 2;
            const y = (pageHeight - imageHeight) / 2;

            output.addImage(
                imageData,
                "JPEG",
                x,
                y,
                imageWidth,
                imageHeight,
                undefined,
                "FAST"
            );

            canvas.width = 1;
            canvas.height = 1;

            completed++;
        }

        setStatus(
            "جاري تجهيز الملف الناتج...",
            "Preparing the output file..."
        );

        const blob = output.output("blob");

        downloadUrl = URL.createObjectURL(blob);

        const difference = file.size - blob.size;
        let savingsMessage;

        if (difference > 0) {
            savingsMessage = t(
                "تم تقليل الحجم بنسبة ",
                "File size reduced by "
            ) + ((difference / file.size) * 100).toFixed(1) + "%";
        } else if (difference === 0) {
            savingsMessage = t(
                "حجم الملف لم يتغير.",
                "The file size did not change."
            );
        } else {
            savingsMessage = t(
                "لم يقل حجم الملف بهذه الإعدادات؛ الملف الناتج أكبر.",
                "The file became larger with these settings."
            );
        }

        const heading = document.createElement("h2");
        heading.textContent = t("نتيجة الضغط", "Compression Result");

        const original = document.createElement("p");
        original.textContent =
            t("الحجم الأصلي: ", "Original size: ") +
            formatSize(file.size);

        const compressed = document.createElement("p");
        compressed.textContent =
            t("الحجم الجديد: ", "New size: ") +
            formatSize(blob.size);

        const pages = document.createElement("p");
        pages.textContent =
            t("عدد الصفحات: ", "Number of pages: ") + completed;

        const message = document.createElement("p");
        message.textContent = savingsMessage;

        const link = document.createElement("a");
        link.href = downloadUrl;
        link.download =
            file.name.replace(/\.pdf$/i, "") + "-compressed.pdf";

        link.textContent = t(
            "تنزيل ملف PDF الناتج",
            "Download Processed PDF"
        );

        link.className = "download";

        resultBox.append(
            heading,
            original,
            compressed,
            pages,
            message,
            link
        );

        resultBox.hidden = false;

        setStatus(
            "انتهت العملية. راجع الحجم والصفحات قبل استخدام الملف.",
            "Processing finished. Check the file size and pages before using the file."
        );

    } catch (error) {
        console.error(error);

        setStatus(
            "تعذر معالجة الملف. تأكد من اتصال الإنترنت وجرب ملف PDF آخر.",
            "Could not process the file. Check your internet connection and try another PDF."
        );

    } finally {
        isCompressing = false;
        button.disabled = false;
        fileInput.disabled = false;
        qualityInput.disabled = false;
    }
});
</script>
</body>
