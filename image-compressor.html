<body>

<h1 data-ar="أداة ضغط الصور" data-en="Image Compressor">
أداة ضغط الصور
</h1>

<p data-ar="قلل حجم صورك بسهولة." data-en="Reduce your image file sizes easily.">
قلل حجم صورك بسهولة.
</p>

<input type="file" id="fileInput" accept="image/*">

<button id="compressButton"
        data-ar="ضغط الصور"
        data-en="Compress Images">
ضغط الصور
</button>

<p id="result" aria-live="polite"></p>

<a class="home" id="homeLink" href="index.html"
   data-ar="العودة إلى الصفحة الرئيسية"
   data-en="Back to Home">
العودة إلى الصفحة الرئيسية
</a>

<script src="language.js"></script>

<script>
const fileInput = document.getElementById("fileInput");
const compressButton = document.getElementById("compressButton");
const result = document.getElementById("result");
const homeLink = document.getElementById("homeLink");

function getToolLanguage() {
    const params = new URLSearchParams(window.location.search);
    const pageLanguage = params.get("lang");

    if (pageLanguage === "en" || pageLanguage === "ar") {
        return pageLanguage;
    }

    try {
        return localStorage.getItem("toolsMarketLanguage") === "en"
            ? "en"
            : "ar";
    } catch (error) {
        return "ar";
    }
}

function t(ar, en) {
    return getToolLanguage() === "en" ? en : ar;
}

function setResult(message) {
    result.textContent = message;
}

applyPageLanguage();

homeLink.href = "index.html?lang=" + getToolLanguage();

compressButton.addEventListener("click", function() {
    const file = fileInput.files[0];

    result.replaceChildren();

    if (!file) {
        setResult(t(
            "من فضلك اختر صورة أولًا.",
            "Please select an image first."
        ));
        return;
    }

    compressButton.disabled = true;

    setResult(t(
        "جاري تجهيز الصورة...",
        "Preparing the image..."
    ));

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    const image = new Image();
    const imageURL = URL.createObjectURL(file);

    image.onload = function() {
        canvas.width = image.width;
        canvas.height = image.height;
        ctx.drawImage(image, 0, 0);

        canvas.toBlob(function(blob) {
            URL.revokeObjectURL(imageURL);
            compressButton.disabled = false;

            if (!blob) {
                setResult(t(
                    "فشل ضغط الصورة.",
                    "Image compression failed."
                ));
                return;
            }

            const link = document.createElement("a");
            const downloadURL = URL.createObjectURL(blob);

            link.href = downloadURL;
            link.download = "compressed-image.jpg";
            link.textContent = t(
                "تنزيل الصورة المضغوطة",
                "Download Compressed Image"
            );

            setResult(t(
                "تم ضغط الصورة بنجاح.",
                "Image compressed successfully."
            ));

            result.appendChild(document.createElement("br"));
            result.appendChild(link);

            link.addEventListener("click", function() {
                setTimeout(function() {
                    URL.revokeObjectURL(downloadURL);
                }, 60000);
            }, { once: true });

        }, "image/jpeg", 0.6);
    };

    image.onerror = function() {
        URL.revokeObjectURL(imageURL);
        compressButton.disabled = false;

        setResult(t(
            "تعذر فتح الصورة.",
            "Could not open the image."
        ));
    };

    image.src = imageURL;
});
</script>
